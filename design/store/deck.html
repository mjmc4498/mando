<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Estrategia 2026 — Presentaciones</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0e10; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .slide { position: absolute; inset: 0; display: grid; grid-template-columns: 1.05fr 1fr; gap: 6vw; align-items: center; padding: 8vh 7vw; background: #fbfbfd; color: #0b0b0c; box-sizing: border-box; }
  .kicker { font-size: 1.4vw; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #ff3b30; }
  h1 { margin: 1.2vh 0 2.4vh; font-size: 5vw; line-height: 1.02; letter-spacing: -.045em; font-weight: 750; }
  p { margin: 0; font-size: 1.7vw; line-height: 1.5; color: #55555a; max-width: 34vw; }
  .stats { display: flex; gap: 3.2vw; margin-top: 5vh; }
  .stat b { display: block; font-size: 3vw; letter-spacing: -.03em; }
  .stat span { font-size: 1.15vw; color: #8e8e93; }
  .chart { height: 58vh; display: flex; align-items: flex-end; gap: 2vw; padding: 3vh 2vw 0; border-bottom: 2px solid #e5e5ea; }
  .bar { flex: 1; border-radius: 1vw 1vw 0 0; background: #e5e5ea; position: relative; }
  .bar.hl { background: #0b0b0c; }
  .bar i { position: absolute; left: 0; right: 0; bottom: -4.2vh; text-align: center; font-style: normal; font-size: 1.1vw; color: #8e8e93; }
  .bar em { position: absolute; left: 0; right: 0; top: -4vh; text-align: center; font-style: normal; font-size: 1.2vw; font-weight: 600; color: #0b0b0c; }
  .foot { position: absolute; left: 7vw; right: 7vw; bottom: 4vh; display: flex; justify-content: space-between; font-size: 1vw; color: #aeaeb2; }
</style>
</head>
<body>
  <div class="slide">
    <div>
      <div class="kicker">Estrategia 2026</div>
      <h1>Crecimiento sostenido, trimestre a trimestre.</h1>
      <p>Las ventas digitales superaron la meta anual y abren espacio para expandirnos a dos nuevas regiones.</p>
      <div class="stats">
        <div class="stat"><b>+38%</b><span>ventas digitales</span></div>
        <div class="stat"><b>4.8</b><span>satisfacción</span></div>
        <div class="stat"><b>12</b><span>nuevos mercados</span></div>
      </div>
    </div>
    <div class="chart">
      <div class="bar" style="height:38%"><em>38</em><i>T1</i></div>
      <div class="bar" style="height:52%"><em>52</em><i>T2</i></div>
      <div class="bar" style="height:64%"><em>64</em><i>T3</i></div>
      <div class="bar hl" style="height:88%"><em>88</em><i>T4</i></div>
    </div>
    <div class="foot"><span>Revisión anual · Equipo comercial</span><span>4 / 18</span></div>
  </div>
</body>
</html>
